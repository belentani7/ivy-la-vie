name: Ivy la Vie / archival photo integrity
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  photographs:
    name: 167 photo paths / local exhibition and a11y
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify photography, archive and accessibility contracts
        run: node --test tests/photo-contract.test.mjs
      - name: Verify entrypoints
        run: |
          test -s index.html
          test -s manifest.json
          test -s README.md
